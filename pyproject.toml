[project]
name = "btcquant"
version = "0.1.0"
description = "Système de trading systématique BTC : backtest, walk-forward, paper/live"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
