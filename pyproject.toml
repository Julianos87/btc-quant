[project]
name = "btcquant"
version = "0.1.0"
description = "Système de trading systématique BTC : backtest, walk-forward, paper/live"
# Plancher à 3.11 : sous 3.10, le lock bascule sur pandas 2.x (majeure
# précédente), alors que le VPS tourne 3.12/pandas 3.0 et le poste de dev
# 3.11/pandas 3.0. Abaisser ce plancher réintroduirait deux moteurs de calcul.
requires-python = ">=3.11"
# Source de vérité unique des dépendances. requirements.txt est GÉNÉRÉ à partir
# d'ici (voir la cible « deps » ci-dessous et le commentaire en tête du fichier) :
# ne pas l'éditer à la main, il resservirait à installer des versions non testées.
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
btcquant-trend = "btcquant.entrypoints.trend:main"
btcquant-carry = "btcquant.entrypoints.carry:main"
btcquant-carry-cutover = "btcquant.entrypoints.carry_cutover:main"
btcquant-readiness = "btcquant.entrypoints.readiness:main"
btcquant-watchdog = "btcquant.entrypoints.watchdog:main"
btcquant-digest = "btcquant.entrypoints.digest:main"
btcquant-rebalance = "btcquant.entrypoints.rebalance:main"
btcquant-shadow = "btcquant.entrypoints.shadow:main"

[tool.uv]
# L'environnement standard couvre tests, exchanges et dashboard. Les outils
# graphiques de recherche restent opt-in via `uv sync --group research`.
default-groups = ["dev", "exchange", "dashboard"]

[dependency-groups]
exchange = [
    "ccxt>=4.5.71",
]
dashboard = [
    "flask>=3.0",
    "gunicorn>=23.0",
    "itsdangerous>=2.2",
]
research = [
    "matplotlib>=3.8",
]
dev = [
    "hypothesis>=6.0",
    "mypy>=1.17",
    "pandas-stubs>=2.3",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=6.2",
    "ruff>=0.6",
]

[tool.mypy]
python_version = "3.11"
packages = ["btcquant"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "yaml"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
branch = true
# Le package research est volontairement hors du runtime qualifié. Ses
# expériences ont leurs propres validations, mais ne peuvent pas diluer le
# seuil de couverture du moteur déployable.
omit = ["src/btcquant/research/*"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "state", "backups", "reports"]

[tool.ruff.lint]
# Volontairement resserré : on veut les vrais défauts (imports morts, variables
# non définies, comparaisons douteuses), pas un reformatage massif du dépôt.
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = [
    "E741",  # noms de variables courts (l, I) : usuels en finance quantitative
    "E702",  # « a = 1; b = 2 » : style, pas un défaut
    "E731",  # lambda assignée : idiome utilisé pour les petites fonctions de coût
    # place_stop/cancel_stop sont des no-op PAR DÉFAUT assumés : les brokers sans
    # stops exchange (PaperBroker) les héritent, et le runner ne les appelle que
    # derrière `supports_stop_orders`. Les rendre abstraites casserait ce design.
    "B027",
]

[tool.ruff.lint.per-file-ignores]
# Ces fichiers doivent amorcer sys.path avant d'importer btcquant (exécution
# directe hors package installé) : l'import après instruction y est structurel.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"dashboard/*.py" = ["E402"]
