name: quality

on:
  push:
    branches: [main]
    paths-ignore:
      - "backups/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = plancher déclaré et version du poste de dev ;
        # 3.12 = version réellement en service sur le VPS (relevé du 18/07/2026).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Installer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchroniser l'environnement depuis uv.lock
        # --locked : échoue si uv.lock ne correspond plus à pyproject.toml,
        # au lieu de le régénérer silencieusement.
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Tests
        run: >-
          uv run --python ${{ matrix.python-version }} pytest
          --cov=btcquant --cov-branch --cov-report=term-missing --cov-fail-under=80

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Installer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Synchroniser l'environnement depuis uv.lock
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Syntaxe frontend
        run: |
          node --check dashboard/static/dashboard.js
          node --check dashboard/static/effects.js

      - name: Typage
        run: uv run mypy src

      - name: Audit des dépendances
        run: >-
          uv run pip-audit -r requirements.txt --disable-pip
          --progress-spinner off --cache-dir .uv-cache/pip-audit --timeout 15 -s osv

      - name: Vérifier l'export de production
        run: |
          uv export --locked --no-default-groups --group exchange --group dashboard \
            --no-emit-project --output-file "${RUNNER_TEMP}/requirements.txt"
          diff -u requirements.txt "${RUNNER_TEMP}/requirements.txt"

      - name: Vérifier le SBOM CycloneDX
        run: uv run python scripts/check_sbom.py

      - name: Vérifier la provenance des références
        run: uv run python scripts/check_reference_provenance.py

      - name: Syntaxe des scripts de déploiement
        run: >-
          bash -n deploy/install.sh deploy/update.sh deploy/create-release.sh
          deploy/preflight.sh deploy/rebalance-root.sh scripts/backup_state.sh
