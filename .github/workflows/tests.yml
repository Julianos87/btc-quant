name: tests

# ─────────────────────────────────────────────────────────────────────────────
# EN SOMMEIL jusqu'au 1er août 2026.
#
# Le quota GitHub Actions gratuit du compte (2 000 min/mois, dépôts privés) est
# épuisé pour juillet : les jobs sont refusés avant de démarrer et chaque push
# produisait un échec inutile. Le quota se réinitialise le 1er du mois.
#
# RÉACTIVATION : décommenter les deux déclencheurs ci-dessous. Rien d'autre à
# changer — le workflow est valide, il a déjà été accepté par GitHub.
#
# En attendant, le hook .githooks/pre-push couvre le lint et les tests, y
# compris sous Python 3.12 (la version du VPS).
# ─────────────────────────────────────────────────────────────────────────────
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:  # déclenchement manuel uniquement
  # La branche `backups` reçoit le track record poussé chaque nuit par le VPS :
  # aucun code n'y change, inutile d'y déclencher la CI.

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = plancher déclaré et version du poste de dev ;
        # 3.12 = version réellement en service sur le VPS (relevé du 18/07/2026).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchroniser l'environnement depuis uv.lock
        # --locked : échoue si uv.lock ne correspond plus à pyproject.toml,
        # au lieu de le régénérer silencieusement.
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Synchroniser l'environnement depuis uv.lock
        run: uv sync --locked --dev

      - name: Ruff
        run: uv run ruff check .
