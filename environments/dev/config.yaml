# ── Configuration générale ────────────────────────────────────────────────
# Profil local de recherche : aucune base d'état de production.
environment: dev
exchange: binance
symbol: BTC/USDT          # plus tard : ETH/USDT, SOL/USDT
quote_currency: USDT

data:
  dir: data
  base_timeframe: 1h      # tout est téléchargé en 1h puis rééchantillonné
  since: "2019-01-01"

costs:
  fee_rate: 0.001         # 0.10 % taker Binance spot (VIP0)
  perp_fee_rate: 0.0005   # 0.05 % taker Binance futures USDT-M
  funding_rate_8h: 0.0001 # 0.01 %/8h : moyenne historique du funding BTC perp
  slippage_bps: 5.0       # 5 bps par côté, conservateur pour BTC liquide

risk:
  initial_capital: 10000
  risk_per_trade: 0.0075  # 0.75 % de l'équity risqué par trade (distance au stop)
  max_position_pct: 0.95  # spot, pas de levier
  vol_target_annual: 0.40 # plafonne le notionnel quand la vol annualisée dépasse la cible
  max_drawdown_halt: 0.30 # kill-switch : liquidation + arrêt si DD > 30 %
  daily_loss_limit: 0.03  # stop de la journée (UTC) si perte > 3 % (intraday/live)
  max_leverage: 1.0       # futures : levier max. ATTENTION — multiplie gains,
                          # pertes ET drawdowns à l'identique. Pour qu'il agisse,
                          # augmenter aussi risk_per_trade / vol_target_annual.

strategies:
  # ── Ensemble trend long-short (perpétuels) ────────────────────────────
  # Trois horizons Donchian standards de la littérature (20/55/100, style
  # turtle) : paramètres NON optimisés sur nos données, diversification du
  # risque de paramètre à la manière des CTA.
  trend_ls_20:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 20, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008, pyramid_atr_step: 0.5, pyramid_add_fraction: 0.30, pyramid_max_adds: 1 }
  trend_ls_55:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 55, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008, pyramid_atr_step: 0.5, pyramid_add_fraction: 0.30, pyramid_max_adds: 1 }
  trend_ls_100:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3334
    params: { donchian: 100, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008, pyramid_atr_step: 0.5, pyramid_add_fraction: 0.30, pyramid_max_adds: 1 }

  # `trend_swing` (spot long/flat) et `intraday_breakout` ont été retirés d'ici :
  # ils vivent dans `btcquant.research.strategies`, hors du registre runtime.
  # Les déclarer ici était trompeur — passer `enabled: true` ne les aurait pas
  # activés, cela aurait fait échouer le chargement. Pour les rejouer :
  #   python scripts/run_walkforward.py --strategy trend_swing
  # (intraday_breakout : perdant out-of-sample, Sharpe OOS -0.27, efficacité
  # -0.60 — les frais mangent l'edge ; conservé comme base de travail.)

execution:
  mode: paper             # seule valeur autorisée par la Safety Baseline
  testnet: true           # sandbox Binance quand mode=live
  state_file: state/btcquant_1x.db
  legacy_state_file: state/live_state.json
  poll_buffer_seconds: 20 # marge après la clôture de bougie avant de lire les données
  simulation:
    profile: normal
    profiles:
      normal:
        max_volume_participation: 0.05
        market_impact_bps: 15.0
        volatility_impact_bps: 1.5
        volatility_reference_annual: 0.40
        volatility_multiplier_cap: 3.0
      stress:
        rejection_rate: 0.01
        max_volume_participation: 0.01
        market_impact_bps: 75.0
        volatility_impact_bps: 6.0
        volatility_reference_annual: 0.40
        volatility_multiplier_cap: 5.0
  live_exchange: hyperliquid          # venue des runners (backtest : exchange: ci-dessus)
  live_symbol: "BTC/USDC:USDC"
  # Clés API : variables d'environnement BINANCE_API_KEY / BINANCE_API_SECRET.
  # Jamais dans ce fichier.
