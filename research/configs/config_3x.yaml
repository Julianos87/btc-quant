# ═══ PROFIL AGRESSIF 3x — ensemble trend long-short sur futures ═══
environment: dev
#
# Historique 2019-2026 (frais + slippage + funding inclus), remesuré le
# 27/07/2026 sur les mêmes données que la baseline du profil actif :
#   +1 567 % total (+45,8 %/an) | Sharpe 1.36 | MAX DRAWDOWN -42,1 %
#
# Contrairement à environments/paper/config.yaml, ces chiffres ne sont PAS vérifiés en CI : ce
# profil est archivé et n'a pas de référence hashée. Les remesurer avant de les
# citer (python scripts/run_backtest.py --config research/configs/config_3x.yaml).
#
# À SAVOIR AVANT DE LANCER :
# - le levier ne crée pas d'edge (Sharpe identique au 1x) : il multiplie
#   gains ET pertes par ~3. Un -42 % de creux S'EST produit dans le passé
#   et se reproduira. Le futur fait toujours pire au moins une fois.
# - le risque par trade reste borné (~4.5 % de l'équity par stop) : le levier
#   sert à ouvrir des positions plus grandes quand la volatilité est basse,
#   pas à supprimer les stops.
# - lancer ce profil UNIQUEMENT après avoir vécu le profil 1x en réel.
#
# Profil historique archivé : ne pas utiliser pour le runtime.
# Usage recherche : python scripts/run_backtest.py --config research/configs/config_3x.yaml

exchange: binance
symbol: BTC/USDT
quote_currency: USDT

data:
  dir: data
  base_timeframe: 1h
  since: "2019-01-01"

costs:
  fee_rate: 0.001
  perp_fee_rate: 0.0005
  funding_rate_8h: 0.0001
  slippage_bps: 5.0

risk:
  initial_capital: 10000
  risk_per_trade: 0.045   # 3 × 1.5 % — perte typique par trade stoppé ~4.5 %
  max_position_pct: 0.95
  vol_target_annual: 1.20 # 3 × 0.40
  max_leverage: 3.0       # transmis à Binance Futures ; liquidation à ~33 %,
                          # les stops (~8-10 %) travaillent bien avant
  max_drawdown_halt: 0.50 # le DD historique du profil est -39 % : un halt à
                          # 30 % couperait la stratégie en fonctionnement
                          # normal. 50 % = protection catastrophe uniquement.
  daily_loss_limit: 0.10  # 3 × ~3 % : bloque les nouvelles entrées du jour

strategies:
  trend_ls_20:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 20, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }
  trend_ls_55:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 55, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }
  trend_ls_100:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3334
    params: { donchian: 100, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }

execution:
  mode: paper             # seule valeur autorisée par la Safety Baseline
  testnet: true
  state_file: state/btcquant_3x.db
  legacy_state_file: state/live_state_3x.json
  poll_buffer_seconds: 20
  simulation:
    profile: normal
    profiles:
      normal:
        max_volume_participation: 0.05
        market_impact_bps: 15.0
        volatility_impact_bps: 1.5
        volatility_reference_annual: 0.40
        volatility_multiplier_cap: 3.0
      stress:
        rejection_rate: 0.01
        max_volume_participation: 0.01
        market_impact_bps: 75.0
        volatility_impact_bps: 6.0
        volatility_reference_annual: 0.40
        volatility_multiplier_cap: 5.0
  live_exchange: hyperliquid          # venue des runners (backtest : exchange: ci-dessus)
  live_symbol: "BTC/USDC:USDC"
