# ═══ PROFIL 4x — ensemble trend long-short sur futures ═══
#
# Historique 2019-2026 (frais + slippage + funding inclus, filtres ADX/funding actifs) :
#   ~+59 %/an (+3 029 % total) | Sharpe ~1.3 | MAX DRAWDOWN -49 % | 426 jours sous le pic
#   Années perdantes : 2022 (-12 %), 2025 (-17 %), 2026 en cours (-5 %)
#
# CONTRAT ACCEPTÉ EN LANÇANT CE PROFIL :
# - un creux de ~-50 % s'est produit dans le passé et se reproduira ; le futur
#   fera pire au moins une fois ;
# - ~14 mois consécutifs sous le sommet précédent, à tenir sans rien modifier ;
# - le risque par trade reste borné (~6 % par stop) et la liquidation (~25 %)
#   reste au-delà des stops (~8-10 %), mais la marge d'erreur est réduite ;
# - toute modification de règle en cours de route annule la validité du backtest.
#
# Usage : python scripts/run_backtest.py --config config_4x.yaml
#         python scripts/run_live.py --config config_4x.yaml

exchange: binance
symbol: BTC/USDT
quote_currency: USDT

data:
  dir: data
  base_timeframe: 1h
  since: "2019-01-01"

costs:
  fee_rate: 0.001
  perp_fee_rate: 0.0005
  funding_rate_8h: 0.0001
  slippage_bps: 5.0

risk:
  initial_capital: 6000   # 60 % d'un portefeuille de 10 000 (les 40 % restants : carry, scripts/run_carry.py)
  risk_per_trade: 0.06    # 4 × 1.5 % — perte typique par trade stoppé ~6 %
  max_position_pct: 0.95
  vol_target_annual: 1.60 # 4 × 0.40
  max_leverage: 4.0       # transmis à Binance Futures
  max_drawdown_halt: 0.60 # DD historique -49 % : halt à 60 % = protection
                          # catastrophe uniquement, ne coupe pas un creux "normal"
  daily_loss_limit: 0.12  # bloque les nouvelles entrées du jour au-delà de -12 %

strategies:
  trend_ls_20:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 20, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }
  trend_ls_55:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3333
    params: { donchian: 55, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }
  trend_ls_100:
    enabled: true
    type: trend_ls
    market: perp
    timeframe: 4h
    capital_fraction: 0.3334
    params: { donchian: 100, adx_min: 20, funding_long_max: 0.0008, funding_short_min: -0.0008 }

execution:
  # Le code rejette toute autre valeur tant que le moteur transactionnel
  # (journal d'ordres, reprise et réconciliation stricte) n'est pas livré.
  mode: paper
  testnet: true
  state_file: state/btcquant.db
  legacy_state_file: state/live_state_4x.json
  poll_buffer_seconds: 20
  # Venue LIVE depuis le 17/07/2026 : Hyperliquid (funding horaire, converti en
  # équivalent 8 h par venue.py). La référence backtest reste Binance 2019-2026
  # (exchange: ci-dessus) — écart documenté au protocole : la comparaison
  # paper-vs-backtest du funding est indicative, pas exacte.
  live_exchange: hyperliquid
  live_symbol: "BTC/USDC:USDC"
